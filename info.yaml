# Tiny Tapeout project information
project:
  title:        "MUA Noise Canceller with Fixed-Gain PID Controller"    # Project title
  author:       "Yuxuan Huo"                                # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Receives Brain Signal and Desired Signal, computes PID-based error correction, and outputs a stimulus signal for cortical visual prosthetics."
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000        # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_hyx1111bit_fixed_pid"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_hyx1111bit_fixed_pid.v"
    - "Data_Receiver.v"
    - "Unsigned2Signed_Converter.v"
    - "PID_Controller_Integrated_Scale.v"
    - "Signed2Unsigned_Converter.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Brain Signal bit 0"
  ui[1]: "Brain Signal bit 1"
  ui[2]: "Brain Signal bit 2"
  ui[3]: "Brain Signal bit 3"
  ui[4]: "Brain Signal bit 4"
  ui[5]: "Brain Signal bit 5"
  ui[6]: "Brain Signal bit 6"
  ui[7]: "Brain Signal bit 7"

  # Outputs
  uo[0]: "Stimulus Signal bit 0"
  uo[1]: "Stimulus Signal bit 1"
  uo[2]: "Stimulus Signal bit 2"
  uo[3]: "Stimulus Signal bit 3"
  uo[4]: "Stimulus Signal bit 4"
  uo[5]: "Stimulus Signal bit 5"
  uo[6]: "Stimulus Signal bit 6"
  uo[7]: "Stimulus Signal bit 7"

  # Bidirectional pins
  uio[0]: "Desired Signal bit 0"
  uio[1]: "Desired Signal bit 1"
  uio[2]: "Desired Signal bit 2"
  uio[3]: "Desired Signal bit 3"
  uio[4]: "Desired Signal bit 4"
  uio[5]: "Desired Signal bit 5"
  uio[6]: "Desired Signal bit 6"
  uio[7]: "Desired Signal bit 7"

# Do not change!
yaml_version: 6
